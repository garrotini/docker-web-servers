server {
    listen 80;
    server_name localhost;
    return 301 https://localhost:8084$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    root  /usr/share/nginx/html;
    index index.html;
}
